[project]
name = "glyphlab"
version = "0.1.0.dev0"
requires-python = ">=3.11"
description = "Create personal handwriting fonts from printable paper templates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "glyphlab contributors"}]
keywords = ["font", "handwriting", "japanese", "kana"]
classifiers = ["Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Text Processing :: Fonts"]
dependencies = [
    "brotli>=1.2",
    "defusedxml>=0.7.1",
    "fonttools[woff]>=4.63",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.8",
    "pillow>=12",
    "pillow-heif>=1.4",
    "pydantic>=2.13",
    "reportlab>=5.0",
    "skia-pathops>=0.9",
    "typer>=0.27",
]

[project.optional-dependencies]
trace = [
    "potracer>=0.0.4",
]
qa = [
    "fontbakery>=1.1,<1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
glyphlab = "glyphlab.cli.main:app"

[project.entry-points."glyphlab.completers"]

[project.urls]
Homepage = "https://github.com/Saber5656/glyphlab"
Issues = "https://github.com/Saber5656/glyphlab/issues"
Changelog = "https://github.com/Saber5656/glyphlab/blob/main/CHANGELOG.md"
