# Recommended required checks: python (ubuntu-latest, 3.11), python (ubuntu-latest, 3.12),
# python (macos-latest, 3.11), python (macos-latest, 3.12).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_failure_probe:
        description: Verify failure trace artifact collection
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Install potrace (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends potrace
      - name: Install potrace (macOS)
        if: runner.os == 'macOS'
        run: brew install potrace
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run python --version
      - run: uv python list --only-installed
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/core/src
      - run: uv run pytest -q --maxfail=5
      - run: uv run python -m glyphlab_service.export_openapi > /tmp/openapi.json && diff -u packages/service/openapi.json /tmp/openapi.json
      - run: bash scripts/check_workflow_hygiene.sh
      - run: bash deploy/check_runbook.sh
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --locked --all-packages --all-extras
        working-directory: .
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/generated/
      - run: npm run lint && npm run typecheck && npm test && npm run build
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: glyphlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker image inspect glyphlab:ci --format '{{.Size}}' | awk '{print "Image bytes:", $1; exit !($1 < 900*1024*1024)}'
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - run: bash scripts/smoke_compose.sh
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --locked --all-packages --all-extras
      - run: docker compose -f deploy/docker-compose.yml restart && docker compose -f deploy/docker-compose.yml up -d --wait
      - run: ABUSE_BASE_URL=http://localhost:8080 uv run pytest packages/service/tests/abuse -q
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs && docker compose -f deploy/docker-compose.yml down -v
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: '3.12'
      SOURCE_DATE_EPOCH: '1700000000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends potrace
      - if: runner.os == 'macOS'
        run: brew install potrace
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run pytest packages/core/tests/e2e -m slow -q -s
      - run: uv run pytest packages/core/tests/test_packaging.py -m packaging -q
      - run: bash scripts/run_readme_quickstart.sh
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: glyphlab
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: glyphlab_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://glyphlab:test-only-local@localhost:5432/glyphlab_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run pytest packages/service/tests/db packages/service/tests/jobs/test_queue.py -q
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.4.100'
      - run: flyctl config validate --config deploy/fly.toml
        env:
          # Local validation does not contact Fly; the CLI requires a nonempty placeholder.
          FLY_API_TOKEN: local-config-validation-only
      - run: bash deploy/check_runbook.sh
  web-e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      E2E_DATA_DIR: ${{ github.workspace }}/e2e-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --locked --all-packages --all-extras
      - run: npm ci && npx playwright install --with-deps chromium webkit
        working-directory: webui
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: glyphlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          install -d -m 0777 e2e-data
          docker compose -f deploy/docker-compose.yml -f deploy/compose.e2e.yml up -d --wait
      - run: npx playwright test
        working-directory: webui
      - name: Exercise failure trace collection
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_failure_probe
        id: failure-probe
        continue-on-error: true
        env:
          E2E_FAILURE_PROBE: '1'
        run: npx playwright test --project=chromium --output=test-results-failure-probe
        working-directory: webui
      - name: Verify the probe failed as intended
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_failure_probe
        env:
          PROBE_OUTCOME: ${{ steps.failure-probe.outcome }}
        run: test "$PROBE_OUTCOME" = failure
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-evidence
          path: |
            webui/playwright-report/
            webui/test-results/
            webui/test-results-failure-probe/
          retention-days: 7
      - if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/compose.e2e.yml logs && docker compose -f deploy/docker-compose.yml -f deploy/compose.e2e.yml down -v
