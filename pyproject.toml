[project]
name = "glyphlab-workspace"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = ["glyphlab", "glyphlab-service"]

[tool.uv.workspace]
members = ["packages/core", "packages/service"]

[dependency-groups]
dev = [
  "types-defusedxml>=0.7",
  "glyphlab",
  "glyphlab-service[test]",
  "fontbakery>=1.1,<1.2",
  "hypothesis>=6.100",
  "jsonschema>=4",
  "mypy>=1.14",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
  "pypdfium2>=5.13.0",
  "potracer>=0.0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["packages/core/src"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-m 'not slow and not packaging'"
markers = ["slow: full pipeline acceptance", "packaging: isolated wheel installation"]

[tool.bandit]

[[tool.mypy.overrides]]
module = ["fontTools.*", "reportlab.*", "pathops"]
ignore_missing_imports = true

[tool.uv.sources]
glyphlab = { workspace = true }
glyphlab-service = { workspace = true }
