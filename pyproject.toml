[project]
name = "glyphlab-workspace"
version = "0.1.0.dev0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core", "packages/service"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.14",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["packages/core/src"]

[tool.pytest.ini_options]
testpaths = ["packages"]
